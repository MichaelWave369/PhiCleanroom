name: PhiCleanroom Docker isolation probe

on:
  pull_request:
    paths:
      - "src/phicleanroom/sandbox*.py"
      - "tests/test_sandbox.py"
      - "tests/docker_probe_smoke.py"
      - "worker/**"
      - ".github/workflows/isolation-probe.yml"
  push:
    branches: [main]
    paths:
      - "src/phicleanroom/sandbox*.py"
      - "tests/test_sandbox.py"
      - "tests/docker_probe_smoke.py"
      - "worker/**"
      - ".github/workflows/isolation-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local PhiCleanroom core
        run: python -m pip install -e .
      - name: Build known reference probe image
        run: docker build --tag phicleanroom-probe:ci ./worker
      - name: Pin resulting immutable local Docker image ID
        id: image
        run: |
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' phicleanroom-probe:ci)"
          case "$IMAGE_ID" in sha256:*) ;; *) exit 1 ;; esac
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
      - name: Run actual no-network/read-only Docker smoke
        run: python tests/docker_probe_smoke.py "${{ steps.image.outputs.image_id }}"
