name: PhiCleanroom React Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "phicleanroom-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned site packages
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test interactive simulation
        working-directory: web
        run: npm test
      - name: Build React site for the repository subpath
        working-directory: web
        run: npm run build
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://michaelwave369.github.io/PhiCleanroom/
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy static React build
        id: deployment
        uses: actions/deploy-pages@v4
